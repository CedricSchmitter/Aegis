spring:
  application:
    name: aegis
  config:
    import: optional:classpath:application-build.properties
  datasource:
    url: ${AEGIS_DB_URL:jdbc:postgresql://localhost:5432/aegis}
    username: ${AEGIS_DB_USERNAME:aegis}
    password: ${AEGIS_DB_PASSWORD:aegis}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Migrations are numbered per context (ADR-0001), so a new migration of one context can be lower than
    # migrations of another context that are already applied. Additive migrations are applied out of order.
    out-of-order: true
    locations:
      - classpath:db/migration/platform
      - classpath:db/migration/identity
      - classpath:db/migration/documents
      - classpath:db/migration/contracts
      - classpath:db/migration/planning
      - classpath:db/migration/notifications
      - classpath:db/migration/review
      - classpath:db/migration/assistant
      - classpath:db/migration/operations
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: AEGIS_SESSION
        http-only: true
        same-site: lax
        secure: ${AEGIS_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

db-scheduler:
  # AI runs hold a thread while they wait for a model; aegis.ai.max-concurrent-runs keeps the rest free.
  threads: 6
  polling-interval: 2s
  immediate-execution-enabled: true
  delay-startup-until-context-ready: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/openapi.json

aegis:
  household:
    zone: Europe/Berlin
  ingress:
    dir: ${AEGIS_INGRESS_DIR:./data/ingress}
  exports:
    dir: ${AEGIS_EXPORTS_DIR:./data/exports}
  members:
    file: ${AEGIS_MEMBERS_FILE:}
    # Usernames of the household's assistant account (ADR-0017): a member that logs in, receives notices and can be
    # responsible for tasks, but is never a document subject or one of the persons the classifier sees. Designated
    # once at startup and shown under assistant-display-name; persisted in identity, so removing a name here does
    # not turn the account back into a person.
    assistants: ${AEGIS_ASSISTANT_MEMBERS:}
    assistant-display-name: Aegis
  paperless:
    base-url: ${AEGIS_PAPERLESS_URL:http://localhost:8000}
    username: ${AEGIS_PAPERLESS_USERNAME:}
    password: ${AEGIS_PAPERLESS_PASSWORD:}
    connect-timeout: 5s
    read-timeout: 120s
  archival:
    max-attempts: 8
    poll-timeout: 20m
    # Wait between two checks of a submitted consumption task, and the first retry delay (doubling, capped at 30m).
    poll-interval: 5s
    retry-base: 30s
    staging-retention: 7d
    max-upload-bytes: 52428800
  trash:
    # Recoverable trash (ADR-0010): a trashed document, task or contract stays restorable at least this
    # long; the owner chose 30 days. Nothing is deleted permanently, so it also stays restorable afterwards.
    recovery-window: 30d
  review:
    # Background reconciliation of the review inbox (ADR-0009): a daily safety net so that new cards and
    # their notices reach the members even if nobody opens the inbox, which reconciles at once when opened.
    reconciliation-interval: 1d
  operations:
    # Watch over the recurring jobs (ADR-0014): members get a notice when a job is stale or no longer
    # scheduled. Stale thresholds are two job intervals plus 10 minutes, so five minutes adds little delay.
    job-health-watch-interval: 5m
  push:
    # Web Push to the members' devices (ADR-0026). Unread notices are pushed once per device within the catch-up
    # window; older ones stay in the inbox only. The subject is the contact URI push services may use.
    dispatch-interval: 1m
    catch-up-window: 24h
    subject: ${AEGIS_PUSH_SUBJECT:mailto:aegis@aegis.invalid}
  storage:
    # Free space and backup health (ADR-0015). The data path is measured through the JDK; on the VM it is
    # the disk that also holds the archive and the databases. A disk is low below 10 % or 5 GB free, whichever is
    # higher (owner's choice); the same watch then notifies the members once per incident.
    data-path: ${AEGIS_STORAGE_DATA_PATH:${aegis.ingress.dir}}
    low-free-fraction: 0.10
    low-free-space: 5GB
  documents:
    # Automatic classification of new uploads once archived (ADR-0004). Existing and restored documents are only
    # analyzed when a member selects them or starts a bulk run (ADR-0022). Filenames use one household naming
    # language, not the UI language.
    analysis:
      automatic: ${AEGIS_DOCUMENT_ANALYSIS_AUTOMATIC:true}
      filename-language: DE
      max-text-chars: 20000
      bulk:
        max-documents: 500
        batch-size: 3
        poll-interval: 10s
        max-wait: 15m
    # The page editor (ADR-0024): limits of one request and the cache of fetched sources and page previews.
    # The cache is derived data outside the backed-up data; in the container it lives in the writable layer and is
    # emptied by every deployment.
    page-edit:
      max-outputs: 10
      max-pages-per-output: 200
      max-sources: 20
      max-new-pages: 30
      max-attempts: 5
      preview-long-side: 480
      cache-dir: ${AEGIS_PAGE_CACHE_DIR:${java.io.tmpdir}/aegis-page-cache}
      cache-max-bytes: 1073741824
      cache-max-age: 7d
  backup:
    state-file: ${AEGIS_BACKUP_STATE_FILE:}
  import:
    path: ${AEGIS_IMPORT_PATH:}
    actor-username: ${AEGIS_IMPORT_ACTOR:}
  # Bounded AI execution (ADR-0003). Without provider credentials every workload is NOT_CONFIGURED and
  # capture, search and tasks work unchanged. Providers and models are configuration per workload, not code:
  # AEGIS_AI_PROVIDERS lists providers in order of preference; each run uses the first one with credentials that
  # serves its requester (default: the API key, otherwise the owner's subscription through the host runner).
  ai:
    currency: USD
    # Sum of one provider's model calls per household day (aegis.household.zone), unless provider-limits sets its own.
    # These limits and the profiles' max-cost are defaults: a workload whose daily and session limit the household set
    # on the status page uses those instead, for every provider (ADR-0027).
    daily-cost-limit: ${AEGIS_AI_DAILY_COST_LIMIT:0.25}
    max-concurrent-runs: 1
    # A run that finds every slot taken stays queued. A freed slot is handed to the oldest waiting run right away
    # (ADR-0023); this wait is the fallback after which a waiting run checks again on its own.
    slot-wait: 15s
    call-timeout: 120s
    # How the household assistant finds documents (ADR-0025): LABELS_AND_TEXT lets it narrow searches with folders and
    # labels; TEXT_ONLY searches by words alone and exists to compare both with the reference questions (issue #25).
    chat-retrieval: ${AEGIS_AI_CHAT_RETRIEVAL:LABELS_AND_TEXT}
    providers:
      # Claude API with a Console key, billed per token to the key owner.
      anthropic:
        api-key-file: ${AEGIS_ANTHROPIC_API_KEY_FILE:/run/secrets/ai/anthropic-api-key}
        base-url: https://api.anthropic.com
        connect-timeout: 10s
      # The owner's Claude subscription: headless `claude -p` executed by the host runner (ops/claude-runner) under
      # the VM user who logged in to Claude Code. Personal, so only the listed usernames may use it. Costs recorded
      # for these runs are API-equivalent estimates, not charges; the budgets apply unchanged.
      claude-code:
        runner-socket: ${AEGIS_CLAUDE_RUNNER_SOCKET:/run/aegis-claude/runner.sock}
        members: ${AEGIS_AI_SUBSCRIPTION_MEMBERS:}
        max-turns: 3
    # Own limits of a provider, replacing daily-cost-limit and the profiles' max-cost for its runs. The owner's
    # subscription has its own usage limits instead of per-token billing, so its API-equivalent estimates get a
    # higher daily limit and run budget; the API key keeps the household defaults.
    provider-limits:
      claude-code:
        daily-cost-limit: ${AEGIS_AI_SUBSCRIPTION_DAILY_COST_LIMIT:50.00}
        max-run-cost: ${AEGIS_AI_SUBSCRIPTION_MAX_RUN_COST:0.50}
    # Claude API list prices per million tokens, checked on 2026-09-29. A model without a price cannot run, because
    # its cost budget could not be enforced. Predecessors stay priced for runs that were requested with them.
    prices:
      "[claude-haiku-4-5]": {input: 1.00, output: 5.00, cache-read: 0.10, cache-write: 1.25}
      "[claude-sonnet-5-5]": {input: 2.00, output: 10.00, cache-read: 0.20, cache-write: 2.50}
      "[claude-sonnet-5]": {input: 2.00, output: 10.00, cache-read: 0.20, cache-write: 2.50}
      "[claude-opus-5-5]": {input: 4.00, output: 20.00, cache-read: 0.20, cache-write: 5.00}
      "[claude-opus-5]": {input: 5.00, output: 25.00, cache-read: 0.50, cache-write: 6.25}
    # Model families the household chooses per workload in the AI settings: the newest API model of each family.
    # When a new model is released, replace its predecessor here and add its price above. The owner's subscription
    # always uses the newest model of the family through the Claude Code CLI alias (opus, sonnet, haiku).
    models:
      opus: {model: claude-opus-5-5}
      sonnet: {model: claude-sonnet-5-5}
      # Haiku 4.5 has no effort levels; the profiles' effort is not sent to it.
      haiku: {model: claude-haiku-4-5, effort: false}
    # Default family of each workload until a member chooses another one; the choice applies to the whole household.
    workloads:
      # Checks every distinct model below with one structured call; no household data is sent.
      connection-check:
        max-cost: 0.05
        max-duration: 90s
        max-model-calls: 1
        max-tool-calls: 0
        max-output-tokens: 1024
        max-attempts: 2
        max-concurrent: 2
      classification:
        providers: ${AEGIS_AI_PROVIDERS:anthropic,claude-code}
        family: sonnet
        # One structured call per document; low effort keeps thinking short within the output allowance.
        effort: low
        max-cost: 0.05
        max-duration: 2m
        max-model-calls: 4
        max-tool-calls: 6
        max-output-tokens: 2048
        max-attempts: 3
        max-concurrent: 2
      review:
        providers: ${AEGIS_AI_PROVIDERS:anthropic,claude-code}
        family: sonnet
        max-cost: 0.10
        max-duration: 10m
        max-model-calls: 12
        max-tool-calls: 30
        max-output-tokens: 16000
        max-attempts: 3
        max-concurrent: 1
      chat:
        providers: ${AEGIS_AI_PROVIDERS:anthropic,claude-code}
        family: sonnet
        max-cost: 0.10
        max-duration: 5m
        max-model-calls: 8
        max-tool-calls: 20
        max-output-tokens: 8000
        max-attempts: 2
        max-concurrent: 2
