name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (domain, architecture, PostgreSQL integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Verify (unit, architecture and Testcontainers integration tests)
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/**/target/surefire-reports/*.xml
            backend/**/target/failsafe-reports/*.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (types, lint, locale checks, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Generated API client is up to date
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Check
        working-directory: frontend
        run: npm run check
      - name: Build
        working-directory: frontend
        run: npm run build

  image:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: AEGIS_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
