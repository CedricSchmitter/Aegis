name: Passage index verification
on:
  push:
    branches: [codex/passage-index-161]
permissions:
  contents: read
jobs:
  passages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: PostgreSQL passage tests and API export
        working-directory: backend
        run: ./mvnw -B -ntp -pl bootstrap -am verify -Dtest=PassageRevisionTest,DocumentTextServiceTest,PaperlessClientTest -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=PassageIndexIT,OpenApiSnapshotIT -Dfailsafe.failIfNoSpecifiedTests=false -Daegis.openapi.export=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: passage-index-verification
          path: |
            api/openapi.json
            backend/**/target/failsafe-reports/*
          retention-days: 3
